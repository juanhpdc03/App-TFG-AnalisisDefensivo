name: Actualizar analisis BePro

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: bepro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sincronizar BePro y regenerar app
        env:
          BEPRO_API_KEY: ${{ secrets.BEPRO_API_KEY }}
          BEPRO_DATA_TOKEN: ${{ secrets.BEPRO_DATA_TOKEN }}
          BEPRO_AUTH_TOKEN: ${{ secrets.BEPRO_AUTH_TOKEN }}
          BEPRO_TEAM_ID: ${{ vars.BEPRO_TEAM_ID }}
          BEPRO_SEASON_IDS: ${{ vars.BEPRO_SEASON_IDS }}
        run: |
          TEAM_ID="${BEPRO_TEAM_ID:-12987}"
          python scripts/auto_update_bepro.py --team-id "$TEAM_ID"
          python scripts/build_interpretability.py

      - name: Guardar resultados generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/app_data eventing_partidos sequences_partidos outputs/global_clusters
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que subir."
          else
            git commit -m "Actualizar analisis BePro"
            git push
          fi
